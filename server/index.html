
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post API Tester</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 25px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        #preview {
            display: none;
            max-width: 200px;
            max-height: 200px;
            margin-top: 10px;
        }

        #response {
            background: #111827;
            color: #d1fae5;
            padding: 15px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Blog Post API Tester</h2>

    <form id="postForm">

        <label for="apiUrl">API URL</label>
        <input
            type="url"
            id="apiUrl"
            value="http://localhost:5000/posts"
            required
        >

        <label for="method">HTTP Method</label>
        <select id="method">
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="PATCH">PATCH</option>
        </select>

        <label for="title">Title</label>
        <input
            type="text"
            id="title"
            name="title"
            required
        >

        <label for="slug">Slug</label>
        <input
            type="text"
            id="slug"
            name="slug"
            required
        >

        <label for="excerpt">Excerpt</label>
        <textarea
            id="excerpt"
            name="excerpt"
            rows="3"
        ></textarea>

        <label for="cover_image">Cover Image</label>
        <input
            type="file"
            id="cover_image"
            name="cover_image"
            accept="image/*"
        >

        <img id="preview" alt="Image preview">

        <label for="content">Content</label>
        <textarea
            id="content"
            name="content"
            rows="7"
            required
        ></textarea>

        <label for="status">Status</label>
        <select id="status" name="status">
            <option value="draft">Draft</option>
            <option value="published">Published</option>
        </select>

        <label for="published_at">Published At</label>
        <input
            type="datetime-local"
            id="published_at"
            name="published_at"
        >

        <label for="author_id">Author ID</label>
        <input
            type="number"
            id="author_id"
            name="author_id"
            min="1"
            required
        >

        <button type="submit" id="sendBtn">Send API Request</button>
        <button type="reset" style="background:#64748b">Clear Form</button>

    </form>

    <h3>API Response</h3>
    <pre id="response">Response will appear here...</pre>
</div>

<script>
    const form = document.getElementById("postForm");
    const title = document.getElementById("title");
    const slug = document.getElementById("slug");
    const imageInput = document.getElementById("cover_image");
    const preview = document.getElementById("preview");
    const responseBox = document.getElementById("response");
    const sendBtn = document.getElementById("sendBtn");

    title.addEventListener("input", () => {
        slug.value = title.value
            .toLowerCase()
            .trim()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "");
    });

    imageInput.addEventListener("change", () => {
        const file = imageInput.files[0];

        if (preview.dataset.url) {
            URL.revokeObjectURL(preview.dataset.url);
            delete preview.dataset.url;
        }

        if (file) {
            const url = URL.createObjectURL(file);
            preview.src = url;
            preview.dataset.url = url;
            preview.style.display = "block";
        } else {
            preview.style.display = "none";
        }
    });

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const apiUrl = document.getElementById("apiUrl").value.trim();
        const method = document.getElementById("method").value;

        const formData = new FormData();

        formData.append("title", title.value);
        formData.append("slug", slug.value);
        formData.append("excerpt", document.getElementById("excerpt").value);
        formData.append("content", document.getElementById("content").value);
        formData.append("status", document.getElementById("status").value);
        formData.append("published_at", document.getElementById("published_at").value);
        formData.append("author_id", document.getElementById("author_id").value);

        if (imageInput.files[0]) {
           formData.append("cover_image", imageInput.files[0]);
        }

        sendBtn.disabled = true;
        sendBtn.textContent = "Sending...";
        responseBox.textContent = "Sending request...";

        try {
            const response = await fetch(apiUrl, {
                method: method,
                body: formData
            });

            const text = await response.text();

            try {
                responseBox.textContent =
                    "HTTP Status: " + response.status + "\n\n" +
                    JSON.stringify(JSON.parse(text), null, 2);
            } catch {
                responseBox.textContent =
                    "HTTP Status: " + response.status + "\n\n" + text;
            }
        } catch (error) {
            responseBox.textContent =
                "Request failed: " + error.message +
                "\nCheck the API URL, server, and CORS settings.";
        } finally {
            sendBtn.disabled = false;
            sendBtn.textContent = "Send API Request";
        }
    });

    form.addEventListener("reset", () => {
        setTimeout(() => {
            if (preview.dataset.url) {
                URL.revokeObjectURL(preview.dataset.url);
                delete preview.dataset.url;
            }

            preview.removeAttribute("src");
            preview.style.display = "none";
            responseBox.textContent = "Response will appear here...";
        }, 0);
    });
</script>

</body>
</html>
